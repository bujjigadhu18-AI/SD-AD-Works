<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- SD monogram -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="-1" text-anchor="middle" fill="url(#textGrad)">SD</text>
  
  <!-- Signature red line -->
  <rect x="15" y="47" width="34" height="3.5" rx="1.75" fill="url(#redAccent)"/>
</svg>
